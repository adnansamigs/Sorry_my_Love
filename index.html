<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sorry jaan 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffe6ec; --bg2:#fff3ee; --ink:#5b3a3a; --rose:#ff5d8f; --rose-d:#e0457a;
  --card:#fff9f6; --fur:#e9b98a; --fur-d:#d79f6c; --cream:#fff1e3; --line:#f3c9d4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#2a1822; --bg2:#35202b; --ink:#ffe6ec; --rose:#ff7aa5; --rose-d:#ff5d8f;
    --card:#3d2531; --fur:#d9a173; --fur-d:#c48a5c; --cream:#f6dcc3; --line:#5a3446;
  }
}
:root[data-theme="dark"]{
  --bg:#2a1822; --bg2:#35202b; --ink:#ffe6ec; --rose:#ff7aa5; --rose-d:#ff5d8f;
  --card:#3d2531; --fur:#d9a173; --fur-d:#c48a5c; --cream:#f6dcc3; --line:#5a3446;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; color:var(--ink); overflow-x:hidden;
  background:radial-gradient(circle at 50% 0%,var(--bg2),var(--bg) 70%);
  font-family:"Fredoka",ui-rounded,"Segoe UI",system-ui,sans-serif;
  display:flex; justify-content:center;
}
.glow{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0; transition:opacity 1.2s;
  background:radial-gradient(circle at 50% 45%,rgba(255,93,143,.45),rgba(255,150,190,.18) 55%,transparent 80%);
}
.loved .glow{opacity:1; animation:throb 1.6s ease-in-out infinite}
@keyframes throb{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.bigheart{
  position:fixed; left:50%; top:46%; z-index:0; pointer-events:none; font-size:min(80vw,420px);
  transform:translate(-50%,-50%) scale(.2); opacity:0; line-height:1;
}
.loved .bigheart{opacity:.28; animation:beat 1.1s ease-in-out infinite; transition:opacity 1s}
@keyframes beat{0%,100%{transform:translate(-50%,-50%) scale(.95)}50%{transform:translate(-50%,-50%) scale(1.12)}}
main{width:100%; max-width:440px; padding:26px 20px 40px; text-align:center; position:relative; z-index:2}
h1{font-size:2.6rem; line-height:1.1; margin:4px 0 10px; font-weight:600; color:var(--rose-d)}
h1{transition:opacity .6s, transform .6s}
.loved h1{opacity:0; transform:translateY(-12px); pointer-events:none}
.bear{width:250px; max-width:72%; margin:0 auto; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent}
.bear svg{width:100%; height:auto; display:block; overflow:visible; animation:bob 3s ease-in-out infinite}
.bubble{
  position:relative; background:var(--card); border:2px solid var(--line); border-radius:24px;
  padding:18px 20px; margin:20px 0 18px; font-size:1.2rem; line-height:1.45; min-height:150px;
  display:flex; align-items:center; justify-content:center;
}
.bubble::before{
  content:""; position:absolute; left:50%; top:-12px; width:20px; height:20px; margin-left:-10px;
  background:var(--card); border-left:2px solid var(--line); border-top:2px solid var(--line);
  transform:rotate(45deg);
}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.accept{
  font:inherit; font-weight:600; font-size:1.15rem; border:0; border-radius:999px; padding:16px 30px;
  background:var(--rose); color:#fff; cursor:pointer; box-shadow:0 6px 0 var(--rose-d);
  opacity:0; transform:translateY(10px) scale(.9); pointer-events:none;
  transition:opacity .5s, transform .5s;
}
.accept.show{opacity:1; transform:none; pointer-events:auto; animation:nudge 1.8s ease-in-out infinite}
.accept:active{transform:scale(.96)}
.accept:focus-visible{outline:3px solid var(--rose); outline-offset:3px}
.loved .accept{display:none}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1deg)}}

/* bear states */
#eyesHappy,#mouthHappy,#mouthOpen,#holdHeart{display:none}
.talking #mouthSad{display:none}
.talking #mouthOpen{display:inline; animation:talk .28s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:center}
@keyframes talk{from{transform:scaleY(.5)}to{transform:scaleY(1.15)}}
.loved #eyesSad,.loved #brows,.loved .tear,.loved #mouthSad,.loved #pleadPaws{display:none}
.loved #eyesHappy,.loved #holdHeart{display:inline}
.loved:not(.talking) #mouthHappy{display:inline}
.loved .bear svg{animation:joy .7s ease-in-out infinite}
@keyframes joy{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
#pleadPaws{animation:plead .5s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:center bottom}
@keyframes plead{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-5px) rotate(3deg)}}
.tear{animation:tear 1.8s ease-in infinite}
.tear.t2{animation-delay:.9s}
.tear.t3{animation-delay:.45s}
.tear.t4{animation-delay:1.35s}
@keyframes tear{0%{transform:translateY(0);opacity:0}15%{opacity:.95}100%{transform:translateY(46px);opacity:0}}

/* love effects */
.heart{position:fixed; bottom:-50px; z-index:1; pointer-events:none; user-select:none; animation:rise linear forwards}
@keyframes rise{
  0%{transform:translateY(0) translateX(0) scale(.6) rotate(0); opacity:0}
  10%{opacity:1}
  100%{transform:translateY(-115vh) translateX(var(--dx)) scale(1.15) rotate(var(--rot)); opacity:0}
}
.pop{position:fixed; z-index:3; pointer-events:none; animation:pop 1.3s ease-out forwards}
@keyframes pop{
  0%{transform:translate(0,0) scale(.4); opacity:1}
  100%{transform:translate(var(--px),var(--py)) scale(1.3) rotate(var(--rot)); opacity:0}
}
@media (prefers-reduced-motion:reduce){
  .bear svg,.tear,#pleadPaws,.accept.show,.loved .glow,.loved .bigheart,.loved .bear svg,.talking #mouthOpen{animation:none}
  .heart,.pop{animation-duration:.01s}
}
</style>
</head>
<body>
<div class="glow"></div>
<div class="bigheart" aria-hidden="true">💗</div>

<main id="app">
  <h1 id="title">Sorry jaan</h1>

  <div class="bear" id="bear" role="img" aria-label="A crying teddy bear holding his paws together, asking for forgiveness">
    <svg viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg">
      <circle cx="48" cy="48" r="24" fill="var(--fur)"/><circle cx="48" cy="48" r="12" fill="#ffb3c6"/>
      <circle cx="152" cy="48" r="24" fill="var(--fur)"/><circle cx="152" cy="48" r="12" fill="#ffb3c6"/>
      <ellipse cx="100" cy="196" rx="52" ry="34" fill="var(--fur)"/>
      <ellipse cx="100" cy="112" rx="72" ry="64" fill="var(--fur)"/>
      <ellipse cx="100" cy="134" rx="26" ry="19" fill="var(--cream)"/>
      <ellipse cx="100" cy="124" rx="8" ry="5.5" fill="#5b3a3a"/>
      <circle cx="58" cy="130" r="10" fill="#ff8fb0" opacity=".55"/>
      <circle cx="142" cy="130" r="10" fill="#ff8fb0" opacity=".55"/>

      <g id="eyesSad" fill="#3b2323">
        <circle cx="74" cy="106" r="10"/><circle cx="126" cy="106" r="10"/>
        <circle cx="77" cy="102" r="3.5" fill="#fff"/><circle cx="129" cy="102" r="3.5" fill="#fff"/>
        <circle cx="72" cy="110" r="2" fill="#bfe6ff"/><circle cx="124" cy="110" r="2" fill="#bfe6ff"/>
      </g>
      <g id="eyesHappy" fill="none" stroke="#3b2323" stroke-width="5" stroke-linecap="round">
        <path d="M63 108 Q74 94 85 108"/><path d="M115 108 Q126 94 137 108"/>
      </g>
      <g id="brows" stroke="#3b2323" stroke-width="4" stroke-linecap="round">
        <line x1="60" y1="92" x2="86" y2="82"/><line x1="140" y1="92" x2="114" y2="82"/>
      </g>
      <ellipse class="tear" cx="68" cy="118" rx="4.5" ry="7" fill="#7fc8ff"/>
      <ellipse class="tear t2" cx="76" cy="118" rx="3.5" ry="6" fill="#7fc8ff"/>
      <ellipse class="tear t3" cx="124" cy="118" rx="3.5" ry="6" fill="#7fc8ff"/>
      <ellipse class="tear t4" cx="132" cy="118" rx="4.5" ry="7" fill="#7fc8ff"/>

      <path id="mouthSad" d="M91 146 Q100 138 109 146" fill="none" stroke="#5b3a3a" stroke-width="4" stroke-linecap="round"/>
      <ellipse id="mouthOpen" cx="100" cy="145" rx="9" ry="7" fill="#c2415f" stroke="#5b3a3a" stroke-width="3"/>
      <path id="mouthHappy" d="M88 138 Q100 158 112 138 Z" fill="#c2415f" stroke="#5b3a3a" stroke-width="3" stroke-linejoin="round"/>

      <!-- begging paws -->
      <g id="pleadPaws">
        <ellipse cx="68" cy="196" rx="13" ry="24" fill="var(--fur-d)" transform="rotate(-35 68 196)"/>
        <ellipse cx="132" cy="196" rx="13" ry="24" fill="var(--fur-d)" transform="rotate(35 132 196)"/>
        <circle cx="91" cy="178" r="14" fill="var(--fur-d)" stroke="var(--fur)" stroke-width="2"/>
        <circle cx="109" cy="178" r="14" fill="var(--fur-d)" stroke="var(--fur)" stroke-width="2"/>
        <line x1="100" y1="168" x2="100" y2="188" stroke="var(--fur)" stroke-width="2"/>
      </g>
      <!-- heart held after forgiveness -->
      <g id="holdHeart">
        <ellipse cx="62" cy="196" rx="13" ry="24" fill="var(--fur-d)" transform="rotate(-30 62 196)"/>
        <ellipse cx="138" cy="196" rx="13" ry="24" fill="var(--fur-d)" transform="rotate(30 138 196)"/>
        <path d="M100 224 C70 202 74 170 100 184 C126 170 130 202 100 224 Z" fill="var(--rose)" stroke="#fff" stroke-width="3"/>
      </g>
    </svg>
  </div>

  <div class="bubble" id="bubble">
    <span class="sr" id="sr"></span>
    <span id="typed" aria-hidden="true"></span>
  </div>

  <button class="accept" id="accept">I accept your sorry 💗</button>
</main>

<script>
(function(){
  var app = document.body;
  var typed = document.getElementById('typed');
  var sr = document.getElementById('sr');
  var btn = document.getElementById('accept');
  var bear = document.getElementById('bear');
  var emojis = ['💗','💖','💕','💘','❤️','🩷','💞','✨','🌸'];
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var loved = false, typing = false, rain = null;

  var apology = 'I will not sleep suddenly after that. Please forgive me this time. I know that’s my fault, but I was so tired. 🥺';
  var thanks = 'Love you jaaan. You are so kind. 💖';

  function type(text, done){
    typed.textContent = '';
    sr.textContent = text;
    typing = true;
    app.classList.add('talking');
    var n = 0;
    if (reduce){ typed.textContent = text; stop(); return; }
    var t = setInterval(function(){
      n++;
      typed.textContent = text.slice(0, n);
      if (n >= text.length){ clearInterval(t); stop(); }
    }, 55);
    function stop(){
      typing = false;
      app.classList.remove('talking');
      if (done) done();
    }
  }

  function floatHeart(){
    var h = document.createElement('span');
    h.className = 'heart';
    h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    h.style.left = (Math.random()*100) + 'vw';
    h.style.fontSize = (18 + Math.random()*32) + 'px';
    h.style.setProperty('--dx', ((Math.random()-.5)*160) + 'px');
    h.style.setProperty('--rot', ((Math.random()-.5)*60) + 'deg');
    h.style.animationDuration = (4 + Math.random()*4) + 's';
    document.body.appendChild(h);
    setTimeout(function(){ h.remove(); }, 8500);
  }

  function burst(x, y, count){
    for (var k = 0; k < count; k++){
      var p = document.createElement('span');
      p.className = 'pop';
      p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      p.style.left = x + 'px'; p.style.top = y + 'px';
      p.style.fontSize = (16 + Math.random()*26) + 'px';
      var a = Math.random()*Math.PI*2, d = 70 + Math.random()*140;
      p.style.setProperty('--px', Math.cos(a)*d + 'px');
      p.style.setProperty('--py', (Math.sin(a)*d - 30) + 'px');
      p.style.setProperty('--rot', ((Math.random()-.5)*120) + 'deg');
      document.body.appendChild(p);
      setTimeout((function(el){ return function(){ el.remove(); }; })(p), 1400);
    }
  }

  function loveStorm(x, y){
    burst(x, y, 36);
    for (var k = 0; k < 60; k++){ setTimeout(floatHeart, k*70); }
    var waves = 0;
    var w = setInterval(function(){
      burst(Math.random()*window.innerWidth, window.innerHeight*(.25 + Math.random()*.5), 14);
      if (++waves > 6) clearInterval(w);
    }, 700);
    rain = setInterval(floatHeart, 160);
  }

  btn.addEventListener('click', function(e){
    if (loved || typing) return;
    loved = true;
    app.classList.add('loved');
    var x = e.clientX || window.innerWidth/2, y = e.clientY || window.innerHeight/2;
    loveStorm(x, y);
    type(thanks);
  });

  bear.addEventListener('click', function(e){
    if (loved) burst(e.clientX, e.clientY, 14);
  });

  type(apology, function(){ btn.classList.add('show'); });
})();
</script>
</body>
</html>
